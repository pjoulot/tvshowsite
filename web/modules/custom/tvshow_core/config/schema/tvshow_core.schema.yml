tvshow_core.settings:
  type: config_object
  label: 'TV Show settings'
  mapping:
    footer_text:
      type: text
      label: 'Footer text'
    tagline:
      type: label
      label: 'Tagline shown in the header'
    description:
      type: text
      label: 'Description of the site for search engines'
    wiki_path:
      type: string
      label: 'First segment of the wiki addresses'
    wiki_label:
      type: label
      label: 'Name of the wiki in menus and titles'
    ad_html:
      type: text
      label: 'Advertising code of the ad slots'
    social:
      type: mapping
      label: 'Social network addresses'
      mapping:
        facebook:
          type: uri
          label: 'Facebook'
          nullable: true
        x:
          type: uri
          label: 'X'
          nullable: true
        instagram:
          type: uri
          label: 'Instagram'
          nullable: true
        youtube:
          type: uri
          label: 'YouTube'
          nullable: true
        bluesky:
          type: uri
          label: 'Bluesky'
          nullable: true
        steam:
          type: uri
          label: 'Steam'
          nullable: true
